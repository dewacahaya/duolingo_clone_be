name: '👤 Profil & Papan Peringkat'
description: 'API untuk mengambil data statistik pribadi pengguna, mengubah profil, serta melihat peringkat global (Leaderboard).'
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/me
    metadata:
      custom: []
      groupName: '👤 Profil & Papan Peringkat'
      groupDescription: 'API untuk mengambil data statistik pribadi pengguna, mengubah profil, serta melihat peringkat global (Leaderboard).'
      subgroup: ''
      subgroupDescription: ''
      title: |-
        Get Profil Saya (Me)
        * Mengambil informasi lengkap pengguna yang sedang login.
      description: |-
        Setiap kali endpoint ini dipanggil, sistem akan melakukan *Lazy Evaluation* untuk meregenerasi Energy (nyawa) jika waktu tunggunya sudah terpenuhi.
        * @authenticated
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
          "data": {
          "id": 1,
          "name": "Budi Santoso",
          "email": "budi@mail.com",
          "avatar": null,
          "stats": {
          "xp": 1250,
          "gems": 0,
          "streak": 5,
          "energy": 4,
          "rank": 12,
          "next_energy_in": "15m 30s"
          },
          "joined_at": "18 Feb 2026"
          }
          }
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/me/update
    metadata:
      custom: []
      groupName: '👤 Profil & Papan Peringkat'
      groupDescription: 'API untuk mengambil data statistik pribadi pengguna, mengubah profil, serta melihat peringkat global (Leaderboard).'
      subgroup: ''
      subgroupDescription: ''
      title: |-
        Update Profil
        * Mengubah nama atau foto profil (Avatar) pengguna.
      description: |-
        Untuk mengunggah avatar, pastikan mengirim request dalam bentuk `multipart/form-data`.
        * @authenticated
      authenticated: false
      deprecated: false
    headers:
      Content-Type: multipart/form-data
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      name:
        custom: []
        name: name
        description: 'optional Nama baru pengguna.'
        required: false
        example: 'Budi Keren'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      avatar:
        custom: []
        name: avatar
        description: |-
          optional File gambar untuk foto profil (JPG/PNG, Max: 2MB).
          * @response {
          "message": "Profile updated successfully",
          "data": {
          "id": 1,
          "name": "Budi Keren",
          "avatar": "http://localhost:8000/storage/avatars/random-string.png",
          "stats": {
          "xp": 1250
          }
          }
          }
        required: false
        example: null
        type: file
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      name: 'Budi Keren'
    fileParameters:
      avatar: null
    responses: []
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
